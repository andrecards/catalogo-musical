<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Segurança: só carrega código desta página e da API do Deezer; capas e prévias só do CDN do Deezer -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://api.deezer.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://*.dzcdn.net; media-src https://*.dzcdn.net; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Atualização Novembro 2026</title>
<meta name="description" content="Escolha as músicas da Atualização Novembro 2026, ouça uma prévia e gere a sua lista.">
<style>
  :root{
    --bg:#0f0f10; --panel:#17171a; --panel2:#1f1f23; --line:#2a2a30;
    --txt:#f2f2f3; --mut:#9a9aa3; --acc:#ff6a1a; --no:#ff4d5e;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc);cursor:pointer;margin:0}
  .app{display:grid;grid-template-columns:260px minmax(0,1fr);grid-template-rows:1fr auto;height:100dvh}

  /* barra lateral */
  aside{grid-row:1;background:#000;padding:22px 14px;overflow:auto;border-right:1px solid var(--line)}
  .marca{padding:0 8px 18px}
  .marca h1{margin:0 0 4px;font-size:22px;line-height:1.15}
  .marca p{margin:0;color:var(--mut);font-size:13px}
  nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;
    padding:9px 10px;border-radius:8px;color:var(--mut);text-align:left;font-weight:600}
  nav button:hover{background:var(--panel);color:var(--txt)}
  nav button[aria-current="true"]{background:var(--panel2);color:var(--txt)}
  nav .cont{font-weight:400;font-size:12px;white-space:nowrap}
  nav .cont.tem{color:var(--acc);font-weight:700}

  /* conteúdo */
  main{grid-row:1;overflow:auto;background:linear-gradient(180deg,#2a1608 0,var(--bg) 320px)}
  .topo{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:12px;align-items:center;
    padding:14px 28px;background:rgba(15,15,16,.88);backdrop-filter:blur(10px)}
  .busca{flex:1 1 260px;max-width:420px;padding:11px 16px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--txt);font:inherit}
  .busca:focus{outline:2px solid var(--acc);border-color:transparent}
  .modo{display:flex;padding:4px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
  .modo button{padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--mut);white-space:nowrap}
  .modo button[aria-pressed="true"]{background:var(--txt);color:#111}
  .modo button[data-modo="nao"][aria-pressed="true"]{background:var(--no);color:#fff}

  .cab{padding:18px 28px 6px}
  .cab h2{font-size:clamp(28px,5vw,48px);margin:0}
  .cab p{color:var(--mut);margin:6px 0 0}
  .cab-acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .pilula{padding:8px 16px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600}
  .pilula:hover{border-color:var(--txt)}
  .pilula.forte{background:var(--acc);border-color:var(--acc);color:#111}
  .dica{margin:14px 28px 0;padding:12px 16px;border-radius:10px;background:rgba(255,77,94,.1);
    border:1px solid rgba(255,77,94,.3);font-size:14px}
  .dica b{color:var(--no)}

  /* cartões de pasta */
  .pastas{padding:14px 20px 30px;display:flex;flex-direction:column;gap:10px}
  .pasta{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .pasta.tem{border-color:rgba(255,106,26,.45)}
  .pasta-cab{display:grid;grid-template-columns:auto 52px minmax(0,1fr) auto;gap:14px;align-items:center;
    padding:12px 14px;cursor:pointer}
  .pasta-cab:hover{background:var(--panel2)}
  .pasta-cab h3{margin:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pasta-cab .meta{color:var(--mut);font-size:13px}
  .pasta-cab .meta b{color:var(--acc);display:inline;font-weight:700}
  .seta{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--mut);transition:transform .2s}
  .pasta.aberta .seta{transform:rotate(180deg)}
  .faixas{border-top:1px solid var(--line);padding:6px}

  /* faixas */
  .faixa{display:grid;grid-template-columns:28px 44px minmax(0,1fr) 40px;gap:12px;align-items:center;
    padding:6px 8px;border-radius:8px}
  .modo-nao .faixa{grid-template-columns:44px minmax(0,1fr) 40px auto}
  .faixa:hover{background:var(--panel2)}
  .faixa.marcada{background:rgba(255,106,26,.10)}
  .modo-nao .faixa.marcada{background:none}
  .modo-nao .faixa.fora{opacity:.45}
  .modo-nao .faixa.fora .info b{text-decoration:line-through}
  .capa{width:44px;height:44px;border-radius:6px;object-fit:cover;background:var(--panel2);
    display:grid;place-items:center;color:var(--mut);font-weight:700;font-size:14px;flex:none}
  .pasta-cab .capa{width:52px;height:52px}
  .info{min-width:0}
  .info b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info span{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .play{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
  .play:hover,.play.tocando{color:#111;background:var(--acc)}
  .play svg,.seta svg{width:16px;height:16px}
  .descartar{padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
  .descartar.sim{color:var(--no);border-color:rgba(255,77,94,.4)}
  .descartar.sim:hover{background:var(--no);color:#fff}
  .descartar.inc:hover{border-color:var(--txt)}
  .vazio{padding:40px 28px;color:var(--mut)}

  /* barra de baixo */
  footer{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;
    padding:12px 20px;background:#000;border-top:1px solid var(--line)}
  .player{display:flex;align-items:center;gap:12px;min-width:0}
  .player .capa{width:52px;height:52px}
  .player .info{max-width:300px}
  .barra{flex:1;max-width:300px;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
  .barra i{display:block;height:100%;width:0;background:var(--acc)}
  .acoes{display:flex;align-items:center;gap:14px}
  .contador{text-align:right;font-size:14px;color:var(--mut);white-space:nowrap}
  .contador b{color:var(--txt)}
  .contador small{display:block;font-size:12px}
  .contador small.estoura{color:var(--no)}
  .primario{padding:11px 22px;border-radius:999px;background:var(--acc);color:#111;font-weight:700}
  .primario:disabled{opacity:.4;cursor:not-allowed}
  .sec{padding:10px 12px;border-radius:999px;color:var(--mut)}
  .sec:hover{color:var(--txt)}

  /* janela gerar */
  dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--txt);
    width:min(440px,92vw);padding:24px}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog h3{margin:0 0 6px}
  dialog p{color:var(--mut);margin:0 0 16px}
  dialog label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
  dialog input[type=text]{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg);color:var(--txt);font:inherit;margin-bottom:16px}
  .formatos{display:flex;gap:10px;margin-bottom:18px}
  .formatos label{flex:1;display:flex;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);
    border-radius:8px;color:var(--txt);cursor:pointer;margin:0}
  .formatos input{accent-color:var(--acc)}
  .dlg-acoes{display:flex;justify-content:flex-end;gap:8px}

  @media (max-width:820px){
    .app{grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr)}
    aside{grid-row:1;padding:12px;border:0;overflow:hidden;min-width:0}
    .marca{padding:0 4px 10px}
    nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
    nav button{width:auto;white-space:nowrap;background:var(--panel)}
    main{grid-row:2}
    .topo,.cab{padding-left:14px;padding-right:14px}
    .modo{width:100%}
    .modo button{flex:1;padding:8px 6px;font-size:13px}
    .dica{margin:12px 14px 0}
    .pastas{padding:12px 8px 24px}
    .pasta-cab{grid-template-columns:auto 44px minmax(0,1fr) auto;gap:10px;padding:10px}
    .pasta-cab .capa{width:44px;height:44px}
    .modo-nao .faixa{grid-template-columns:44px minmax(0,1fr) auto;gap:8px}
    .modo-nao .faixa .play{display:none}
    footer{grid-template-columns:minmax(0,1fr);gap:8px;padding:10px 12px}
    .player .capa{width:40px;height:40px}
    .barra{display:none}
    .primario{padding:10px 16px;white-space:nowrap}
    .sec{padding:8px}
    .acoes{justify-content:space-between}
    .contador{text-align:left}
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="marca">
      <h1 id="titulo">Atualização Novembro 2026</h1>
      <p id="resumo"></p>
    </div>
    <nav id="menu" aria-label="Categorias"></nav>
  </aside>

  <main id="main">
    <div class="topo">
      <input class="busca" id="busca" type="search" placeholder="Buscar música ou artista…" aria-label="Buscar música ou artista">
      <div class="modo" role="group" aria-label="Como escolher">
        <button data-modo="quero" aria-pressed="true">✓ Escolher as que quero</button>
        <button data-modo="nao" aria-pressed="false">✕ Marcar as que não quero</button>
      </div>
    </div>
    <div class="cab">
      <h2 id="cab-titulo"></h2>
      <p id="cab-sub"></p>
      <div class="cab-acoes" id="cab-acoes"></div>
    </div>
    <div id="dica"></div>
    <div class="pastas" id="lista"></div>
  </main>

  <footer>
    <div class="player">
      <div class="capa" id="p-capa">♪</div>
      <div class="info"><b id="p-titulo">Escolha uma música</b><span id="p-artista">Toque no ▶ para ouvir 30 segundos</span></div>
      <div class="barra" aria-hidden="true"><i id="p-barra"></i></div>
    </div>
    <div class="acoes">
      <div class="contador"><b id="qtd">0</b> músicas · <b id="tam">0 GB</b><small id="cabe"></small></div>
      <button class="sec" id="limpar">Limpar</button>
      <button class="primario" id="gerar" disabled>Gerar lista</button>
    </div>
  </footer>
</div>

<dialog id="dlg">
  <form method="dialog">
    <h3>Gerar lista de músicas</h3>
    <p id="dlg-sub"></p>
    <label for="nome">Seu nome (opcional)</label>
    <input type="text" id="nome" autocomplete="name" placeholder="Ex.: Maria">
    <div class="formatos" role="radiogroup" aria-label="Formato do arquivo">
      <label><input type="radio" name="fmt" value="md" checked> Markdown (.md)</label>
      <label><input type="radio" name="fmt" value="txt"> Texto (.txt)</label>
    </div>
    <div class="dlg-acoes">
      <button class="sec" value="cancel">Cancelar</button>
      <button class="primario" id="baixar" value="ok">Baixar arquivo</button>
    </div>
  </form>
</dialog>

<audio id="audio" preload="none"></audio>
<script src="catalogo.js"></script>
<script src="app.js"></script>
</body>
</html>
